name: Check for gigs

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run check
        working-directory: scripts
        run: python check.py
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit updated matches
        run: |
          git config user.name "gig-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/matches.json
          git diff --staged --quiet || git commit -m "Update matches [skip ci]"
          git push
